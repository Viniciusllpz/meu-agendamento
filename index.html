<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VGenda - Sistema de Agendamentos</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid white;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 0.85rem;
        }

        .btn-success { background-color: var(--success); color: white; }
        .btn-warning { background-color: var(--warning); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }

        .content {
            padding: 24px;
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-muted);
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-pendente { background: #fef3c7; color: #92400e; }
        .badge-reagendado { background: #e0e7ff; color: #3730a3; }
        .badge-concluido { background: #dcfce7; color: #166534; }
        .badge-cancelado { background: #fee2e2; color: #991b1b; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .actions-cell {
            display: flex;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>VGenda</h1>
            <div class="nav-buttons">
                <button class="btn-outline" onclick="switchView('user')">Visão Cliente</button>
                <button class="btn-outline" onclick="switchView('admin')">Painel do Gerente</button>
            </div>
        </header>

        <div class="content">
            <!-- Visão Cliente -->
            <div id="user-view" class="view active">
                <h2>Meus Agendamentos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Serviço</th>
                            <th>Data/Hora</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="user-appointments"></tbody>
                </table>
            </div>

            <!-- Visão Gerente -->
            <div id="admin-view" class="view">
                <h2>Gerenciamento de Agendamentos</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Serviço</th>
                            <th>Data/Hora</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-appointments"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Reagendamento (Gerente) -->
    <div id="reschedule-modal" class="modal">
        <div class="modal-content">
            <h3>Reagendar Atendimento</h3>
            <div class="form-group" style="margin-top: 16px;">
                <label for="new-datetime">Nova Data e Hora</label>
                <input type="datetime-local" id="new-datetime">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 8px;">
                <button class="btn-outline" style="color: var(--text); border-color: var(--border);" onclick="closeRescheduleModal()">Cancelar</button>
                <button class="btn-primary" onclick="confirmAdminReschedule()">Confirmar</button>
            </div>
        </div>
    </div>

    <script>
        // Dados MOCK de exemplo
        let appointments = [
            { id: '1', client: 'João Silva', service: 'Corte de Cabelo', datetime: '2026-09-25T10:00', status: 'Pendente' },
            { id: '2', client: 'Maria Oliveira', service: 'Manicure', datetime: '2026-09-25T14:30', status: 'Reagendamento Solicitado' },
            { id: '3', client: 'Carlos Souza', service: 'Barba e Cabelo', datetime: '2026-09-24T09:00', status: 'Concluido' },
            { id: '4', client: 'Ana Lima', service: 'Design de Sobrancelhas', datetime: '2026-09-23T16:00', status: 'Cancelado' }
        ];

        let selectedAppId = null;

        function switchView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            if (view === 'user') {
                document.getElementById('user-view').classList.add('active');
                renderUserAppointments();
            } else {
                document.getElementById('admin-view').classList.add('active');
                renderAdminAppointments();
            }
        }

        function formatDateTime(dt) {
            const date = new Date(dt);
            return date.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
        }

        function getStatusBadge(status) {
            const map = {
                'Pendente': 'badge-pendente',
                'Reagendamento Solicitado': 'badge-reagendado',
                'Concluido': 'badge-concluido',
                'Cancelado': 'badge-cancelado'
            };
            return `<span class="badge ${map[status] || ''}">${status}</span>`;
        }

        function renderUserAppointments() {
            const tbody = document.getElementById('user-appointments');
            tbody.innerHTML = appointments.map(a => `
                <tr>
                    <td>${a.service}</td>
                    <td>${formatDateTime(a.datetime)}</td>
                    <td>${getStatusBadge(a.status)}</td>
                </tr>
            `).join('');
        }

        function renderAdminAppointments() {
            const tbody = document.getElementById('admin-appointments');
            tbody.innerHTML = appointments.map(a => {
                const isEditable = a.status === 'Pendente' || a.status === 'Reagendamento Solicitado';
                const actionsHtml = isEditable ? `
                    <div class="actions-cell">
                        <button class="btn-sm btn-success" onclick="setAppStatus('${a.id}', 'Concluido')">Concluir</button>
                        <button class="btn-sm btn-warning" onclick="openAdminRescheduleModal('${a.id}')">Reagendar</button>
                        <button class="btn-sm btn-danger" onclick="setAppStatus('${a.id}', 'Cancelado')">Cancelar</button>
                    </div>
                ` : '-';

                return `
                    <tr>
                        <td>${a.client}</td>
                        <td>${a.service}</td>
                        <td>${formatDateTime(a.datetime)}</td>
                        <td>${getStatusBadge(a.status)}</td>
                        <td>${actionsHtml}</td>
                    </tr>
                `;
            }).join('');
        }

        function setAppStatus(id, newStatus) {
            const app = appointments.find(a => a.id === id);
            if (app) {
                app.status = newStatus;
                renderAdminAppointments();
            }
        }

        function openAdminRescheduleModal(id) {
            selectedAppId = id;
            document.getElementById('reschedule-modal').classList.add('active');
        }

        function closeRescheduleModal() {
            selectedAppId = null;
            document.getElementById('new-datetime').value = '';
            document.getElementById('reschedule-modal').classList.remove('active');
        }

        function confirmAdminReschedule() {
            const newDt = document.getElementById('new-datetime').value;
            if (!newDt) {
                alert('Por favor, selecione uma nova data e hora.');
                return;
            }

            const app = appointments.find(a => a.id === selectedAppId);
            if (app) {
                app.datetime = newDt;
                app.status = 'Pendente';
                renderAdminAppointments();
                closeRescheduleModal();
            }
        }

        // Inicialização
        renderUserAppointments();
    </script>
</body>
</html>
